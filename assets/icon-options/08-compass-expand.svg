  <line x1="512" y1="440" x2="512" y2="240" stroke="url(#arr8v)" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
  <polyline points="480,280 512,240 544,280" fill="none" stroke="#f59e0b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/>
  <!-- Down arrow -->
  <line x1="512" y1="584" x2="512" y2="784" stroke="url(#arr8v)" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
  <polyline points="480,744 512,784 544,744" fill="none" stroke="#ef4444" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/>
  <!-- Left arrow -->
