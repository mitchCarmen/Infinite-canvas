<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0720"/>
      <stop offset="100%" style="stop-color:#1a0a30"/>
    </linearGradient>
    <linearGradient id="panel6a" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ec4899"/>
      <stop offset="100%" style="stop-color:#f97316"/>
    </linearGradient>
    <linearGradient id="panel6b" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6"/>
      <stop offset="100%" style="stop-color:#ec4899"/>
    </linearGradient>
    <linearGradient id="panel6c" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" rx="220" fill="url(#bg6)"/>
  <!-- Back panel -->
  <rect x="320" y="220" width="440" height="320" rx="16" fill="url(#panel6c)" opacity="0.15" stroke="#3b82f6" stroke-width="2" />
  <!-- Middle panel -->
  <rect x="260" y="320" width="440" height="320" rx="16" fill="url(#panel6b)" opacity="0.2" stroke="#8b5cf6" stroke-width="2.5"/>
  <!-- Content lines on middle panel -->
  <line x1="300" y1="380" x2="520" y2="380" stroke="#c4b5fd" stroke-width="2" opacity="0.3" stroke-linecap="round"/>
  <line x1="300" y1="420" x2="460" y2="420" stroke="#c4b5fd" stroke-width="2" opacity="0.2" stroke-linecap="round"/>
  <!-- Front panel -->
  <rect x="220" y="420" width="440" height="320" rx="16" fill="url(#panel6a)" opacity="0.25" stroke="#ec4899" stroke-width="3"/>
  <!-- Content lines on front panel -->
  <line x1="264" y1="490" x2="500" y2="490" stroke="#fecdd3" stroke-width="2.5" opacity="0.4" stroke-linecap="round"/>
  <line x1="264" y1="536" x2="440" y2="536" stroke="#fecdd3" stroke-width="2.5" opacity="0.3" stroke-linecap="round"/>
  <line x1="264" y1="582" x2="380" y2="582" stroke="#fecdd3" stroke-width="2" opacity="0.2" stroke-linecap="round"/>
  <!-- Floating accent dot -->
  <circle cx="740" cy="300" r="5" fill="#f472b6" opacity="0.4"/>
  <circle cx="780" cy="720" r="4" fill="#818cf8" opacity="0.3"/>
</svg>