<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a1a"/>
      <stop offset="100%" style="stop-color:#1a0a2e"/>
    </linearGradient>
    <linearGradient id="plane5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#14b8a6"/>
      <stop offset="100%" style="stop-color:#6366f1"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" rx="220" fill="url(#bg5)"/>
  <!-- Perspective grid - horizontal lines -->
  <line x1="160" y1="380" x2="864" y2="380" stroke="#14b8a6" stroke-width="1.5" opacity="0.08"/>
  <line x1="200" y1="440" x2="824" y2="440" stroke="#14b8a6" stroke-width="1.5" opacity="0.12"/>
  <line x1="240" y1="500" x2="784" y2="500" stroke="#14b8a6" stroke-width="2" opacity="0.18"/>
  <line x1="220" y1="560" x2="804" y2="560" stroke="#6366f1" stroke-width="2" opacity="0.25"/>
  <line x1="190" y1="620" x2="834" y2="620" stroke="#6366f1" stroke-width="2" opacity="0.2"/>
  <line x1="170" y1="680" x2="854" y2="680" stroke="#6366f1" stroke-width="1.5" opacity="0.12"/>
  <line x1="160" y1="740" x2="864" y2="740" stroke="#6366f1" stroke-width="1.5" opacity="0.06"/>
  <!-- Vertical converging lines -->
  <line x1="512" y1="240" x2="512" y2="820" stroke="url(#plane5)" stroke-width="2" opacity="0.3"/>
  <line x1="512" y1="280" x2="320" y2="820" stroke="#14b8a6" stroke-width="1.5" opacity="0.15"/>
  <line x1="512" y1="280" x2="704" y2="820" stroke="#6366f1" stroke-width="1.5" opacity="0.15"/>
  <line x1="512" y1="320" x2="200" y2="820" stroke="#14b8a6" stroke-width="1" opacity="0.08"/>
  <line x1="512" y1="320" x2="824" y2="820" stroke="#6366f1" stroke-width="1" opacity="0.08"/>
  <!-- Floating cards on the plane -->
  <g opacity="0.7">
    <rect x="360" y="430" width="100" height="70" rx="8" fill="none" stroke="#14b8a6" stroke-width="2.5" transform="skewX(-5)"/>
    <rect x="540" y="470" width="120" height="80" rx="8" fill="none" stroke="#818cf8" stroke-width="2.5" transform="skewX(-5)"/>
    <rect x="400" y="550" width="80" height="55" rx="6" fill="none" stroke="#6366f1" stroke-width="2" transform="skewX(-5)" opacity="0.5"/>
  </g>
  <!-- Vanishing point glow -->
  <circle cx="512" cy="300" r="6" fill="#5eead4" opacity="0.6"/>
  <circle cx="512" cy="300" r="20" fill="none" stroke="#5eead4" stroke-width="1.5" opacity="0.2"/>
</svg>