<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg10" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a18"/>
      <stop offset="100%" style="stop-color:#141428"/>
    </linearGradient>
    <linearGradient id="inf10a" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="50%" style="stop-color:#8b5cf6"/>
      <stop offset="100%" style="stop-color:#ec4899"/>
    </linearGradient>
    <linearGradient id="inf10b" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ec4899"/>
      <stop offset="50%" style="stop-color:#f59e0b"/>
      <stop offset="100%" style="stop-color:#3b82f6"/>
    </linearGradient>
    <filter id="glow10">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1024" height="1024" rx="220" fill="url(#bg10)"/>
  <!-- Infinity symbol - main path -->
  <g filter="url(#glow10)" transform="translate(512, 512) scale(1.1) translate(-512, -512)">
    <!-- Top/front loop stroke -->
    <path d="M512 512 C512 400, 340 340, 300 440 C260 540, 380 600, 512 512"
          fill="none" stroke="url(#inf10a)" stroke-width="6" stroke-linecap="round" opacity="0.9"/>
    <!-- Bottom/back loop stroke -->
    <path d="M512 512 C512 400, 684 340, 724 440 C764 540, 644 600, 512 512"
          fill="none" stroke="url(#inf10b)" stroke-width="6" stroke-linecap="round" opacity="0.9"/>
  </g>
  <!-- Echo trails -->
  <path d="M512 512 C512 370, 310 300, 260 430 C210 560, 370 640, 512 512"
        fill="none" stroke="#3b82f6" stroke-width="2" stroke-linecap="round" opacity="0.12"/>
  <path d="M512 512 C512 370, 714 300, 764 430 C814 560, 654 640, 512 512"
        fill="none" stroke="#ec4899" stroke-width="2" stroke-linecap="round" opacity="0.12"/>
  <!-- Grid dots underneath -->
  <g opacity="0.12">
    <circle cx="300" cy="380" r="2.5" fill="#6366f1"/>
    <circle cx="380" cy="380" r="2.5" fill="#6366f1"/>
    <circle cx="460" cy="380" r="2.5" fill="#6366f1"/>
    <circle cx="540" cy="380" r="2.5" fill="#6366f1"/>
    <circle cx="620" cy="380" r="2.5" fill="#6366f1"/>
    <circle cx="700" cy="380" r="2.5" fill="#6366f1"/>
    <circle cx="300" cy="460" r="2.5" fill="#6366f1"/>
    <circle cx="380" cy="460" r="2.5" fill="#6366f1"/>
    <circle cx="620" cy="460" r="2.5" fill="#6366f1"/>
    <circle cx="700" cy="460" r="2.5" fill="#6366f1"/>
    <circle cx="300" cy="540" r="2.5" fill="#6366f1"/>
    <circle cx="380" cy="540" r="2.5" fill="#6366f1"/>
    <circle cx="620" cy="540" r="2.5" fill="#6366f1"/>
    <circle cx="700" cy="540" r="2.5" fill="#6366f1"/>
    <circle cx="300" cy="620" r="2.5" fill="#6366f1"/>
    <circle cx="380" cy="620" r="2.5" fill="#6366f1"/>
    <circle cx="460" cy="620" r="2.5" fill="#6366f1"/>
    <circle cx="540" cy="620" r="2.5" fill="#6366f1"/>
    <circle cx="620" cy="620" r="2.5" fill="#6366f1"/>
    <circle cx="700" cy="620" r="2.5" fill="#6366f1"/>
  </g>
  <!-- Center crossing point -->
  <circle cx="512" cy="512" r="8" fill="#f0abfc" opacity="0.7"/>
  <circle cx="512" cy="512" r="3" fill="white" opacity="0.9"/>
</svg>