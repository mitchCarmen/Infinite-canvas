<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg9" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#050510"/>
      <stop offset="100%" style="stop-color:#0a0a20"/>
    </linearGradient>
    <linearGradient id="ring9" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06b6d4"/>
      <stop offset="25%" style="stop-color:#8b5cf6"/>
      <stop offset="50%" style="stop-color:#ec4899"/>
      <stop offset="75%" style="stop-color:#f59e0b"/>
      <stop offset="100%" style="stop-color:#06b6d4"/>
    </linearGradient>
    <filter id="glow9">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1024" height="1024" rx="220" fill="url(#bg9)"/>
  <!-- Inner depth rings -->
  <ellipse cx="512" cy="520" rx="80" ry="60" fill="none" stroke="#6366f1" stroke-width="1.5" opacity="0.15"/>
  <ellipse cx="512" cy="518" rx="120" ry="95" fill="none" stroke="#818cf8" stroke-width="1.5" opacity="0.2"/>
  <ellipse cx="512" cy="516" rx="160" ry="130" fill="none" stroke="#a78bfa" stroke-width="2" opacity="0.15"/>
  <!-- Main ring -->
  <g filter="url(#glow9)">
    <circle cx="512" cy="512" r="220" fill="none" stroke="url(#ring9)" stroke-width="6" opacity="0.85"/>
  </g>
  <!-- Outer echo ring -->
  <circle cx="512" cy="512" r="280" fill="none" stroke="url(#ring9)" stroke-width="2" opacity="0.15"/>
  <circle cx="512" cy="512" r="320" fill="none" stroke="url(#ring9)" stroke-width="1.5" opacity="0.06"/>
  <!-- Center depth illusion -->
  <circle cx="512" cy="512" r="30" fill="#0a0a20" opacity="0.8"/>
  <circle cx="512" cy="512" r="8" fill="#6366f1" opacity="0.5"/>
  <circle cx="512" cy="512" r="3" fill="#c4b5fd" opacity="0.8"/>
  <!-- Sparkle accents -->
  <circle cx="380" cy="330" r="3" fill="#06b6d4" opacity="0.5"/>
  <circle cx="660" cy="360" r="2.5" fill="#ec4899" opacity="0.4"/>
  <circle cx="700" cy="650" r="3" fill="#f59e0b" opacity="0.4"/>
  <circle cx="340" cy="680" r="2.5" fill="#8b5cf6" opacity="0.5"/>
</svg>