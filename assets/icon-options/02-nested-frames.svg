<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a14"/>
      <stop offset="100%" style="stop-color:#12121f"/>
    </linearGradient>
    <linearGradient id="frame2a" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#67e8f9"/>
      <stop offset="100%" style="stop-color:#93c5fd"/>
    </linearGradient>
    <clipPath id="roundClip">
      <rect width="1024" height="1024" rx="220"/>
    </clipPath>
  </defs>
  <g clip-path="url(#roundClip)">
    <rect width="1024" height="1024" fill="url(#bg2)"/>
    <!-- Outermost frame -->
    <rect x="160" y="160" width="704" height="704" rx="24" fill="none" stroke="#67e8f9" stroke-width="5" opacity="0.6"/>
    <!-- Second frame -->
    <rect x="235" y="235" width="554" height="554" rx="20" fill="none" stroke="#7dd3fc" stroke-width="5.5" opacity="0.7"/>
    <!-- Third frame -->
    <rect x="310" y="310" width="404" height="404" rx="16" fill="none" stroke="#93c5fd" stroke-width="6" opacity="0.8"/>
    <!-- Fourth frame -->
    <rect x="380" y="380" width="264" height="264" rx="12" fill="none" stroke="#a5b4fc" stroke-width="7" opacity="0.9"/>
    <!-- Innermost frame -->
    <rect x="445" y="445" width="134" height="134" rx="8" fill="none" stroke="#c7d2fe" stroke-width="8" opacity="1"/>
    <!-- Center dot -->
    <circle cx="512" cy="512" r="12" fill="#e0e7ff"/>
    <circle cx="512" cy="512" r="5" fill="white"/>
    <!-- Corner accents on outer frame -->
    <path d="M160 230 L160 160 L230 160" fill="none" stroke="url(#frame2a)" stroke-width="6" stroke-linecap="round" opacity="0.9"/>
    <path d="M794 160 L864 160 L864 230" fill="none" stroke="url(#frame2a)" stroke-width="6" stroke-linecap="round" opacity="0.9"/>
    <path d="M864 794 L864 864 L794 864" fill="none" stroke="url(#frame2a)" stroke-width="6" stroke-linecap="round" opacity="0.9"/>
    <path d="M230 864 L160 864 L160 794" fill="none" stroke="url(#frame2a)" stroke-width="6" stroke-linecap="round" opacity="0.9"/>
  </g>
</svg>